isplay:block;font-size:13px">Administrator</span><span class="small muted trunc" style="display:block;font-weight:400">jonah@meridianlogistics.example</span></span></button><button class="btn" style="height:auto;padding:8px 10px;justify-content:flex-start;text-align:left;gap:10px" aria-pressed="false"><span class="avatar " style="flex:none">PR</span><span style="min-width:0"><span class="strong" style="display:block;font-size:13px">Workflow Creator</span><span class="small muted trunc" style="display:block;font-weight:400">priya@meridianlogistics.example</span></span></button><button class="btn" style="height:auto;padding:8px 10px;justify-content:flex-start;text-align:left;gap:10px" aria-pressed="false"><span class="avatar a3" style="flex:none">RS</span><span style="min-width:0"><span class="strong" style="display:block;font-size:13px">Technical Operator</span><span class="small muted trunc" style="display:block;font-weight:400">rahul@meridianlogistics.example</span></span></button><button class="btn" style="height:auto;padding:8px 10px;justify-content:flex-start;text-align:left;gap:10px" aria-pressed="false"><span class="avatar a2" style="flex:none">LC</span><span style="min-width:0"><span class="strong" style="display:block;font-size:13px">Business User</span><span class="small muted trunc" style="display:block;font-weight:400">lena@meridianlogistics.example</span></span></button></section></main></div></div>
